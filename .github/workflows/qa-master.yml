name: QA Master Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: 'Suite a correr'
        required: false
        default: 'all'
        type: choice
        options: [all, lint, data-quality, structure, summary]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: Lint & estructura de tests E2E
  # ─────────────────────────────────────────────────────────────
  lint-e2e:
    name: 🎭 Lint — E2E Suite (Playwright)
    runs-on: ubuntu-latest

    steps:
      - name: Clone E2E repo
        uses: actions/checkout@v4
        with:
          repository: marcebusi/qa-playwright-cryptogamer
          path: e2e

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: e2e
        run: npm ci

      - name: TypeScript compile check
        working-directory: e2e
        run: ./node_modules/.bin/tsc --noEmit

      - name: Verificar estructura de archivos
        run: |
          echo "✅ Verificando estructura del proyecto E2E..."
          test -f e2e/playwright.config.ts     && echo "✓ playwright.config.ts"
          test -d e2e/tests                    && echo "✓ tests/"
          test -d e2e/pages                    && echo "✓ pages/ (Page Object Model)"
          test -f e2e/package.json             && echo "✓ package.json"
          echo "✅ Estructura válida"

  # ─────────────────────────────────────────────────────────────
  # JOB 2: Lint & estructura de tests API
  # ─────────────────────────────────────────────────────────────
  lint-api:
    name: 🔌 Lint — API Suite (Playwright)
    runs-on: ubuntu-latest

    steps:
      - name: Clone API repo
        uses: actions/checkout@v4
        with:
          repository: marcebusi/qa-api-testing-cryptogamer
          path: api

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: api
        run: npm ci

      - name: TypeScript compile check
        working-directory: api
        run: ./node_modules/.bin/tsc --noEmit

      - name: Verificar estructura de archivos
        run: |
          echo "✅ Verificando estructura del proyecto API..."
          test -f api/playwright.config.ts     && echo "✓ playwright.config.ts"
          test -d api/api-tests                && echo "✓ api-tests/"
          test -f api/global-setup.ts          && echo "✓ global-setup.ts"
          echo "✅ Estructura válida"

  # ─────────────────────────────────────────────────────────────
  # JOB 3: Data Quality — corre contra la DB del repo
  # ─────────────────────────────────────────────────────────────
  data-quality:
    name: 🗄️ Data Quality — pytest
    runs-on: ubuntu-latest

    steps:
      - name: Clone Data Quality repo
        uses: actions/checkout@v4
        with:
          repository: marcebusi/qa-data-quality-cryptogamer
          path: dq

      - name: Clone cryptogamer-ecommerce (para la DB)
        uses: actions/checkout@v4
        with:
          repository: marcebusi/cryptogamer-ecommerce
          path: app

      - name: Setup Node y generar DB
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generar DB con Prisma
        working-directory: app/backend
        run: |
          npm ci
          npx prisma db push --accept-data-loss
          npx prisma db seed || true
          echo "DB generada en:"
          ls -la prisma/
        env:
          DATABASE_URL: "file:./dev.db"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install y correr Data Quality tests
        working-directory: dq
        run: |
          pip install pytest pandas
          pytest tests/ -v
        env:
          DB_PATH: ${{ github.workspace }}/app/backend/prisma/dev.db

      - name: Upload reporte
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dq-results
          path: dq/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # JOB 4: Verificar pipelines de los otros proyectos
  # ─────────────────────────────────────────────────────────────
  validate-pipelines:
    name: 📋 Validar YAMLs de CI de todos los proyectos
    runs-on: ubuntu-latest

    steps:
      - name: Clone todos los repos QA
        run: |
          git clone https://github.com/marcebusi/qa-playwright-cryptogamer.git e2e
          git clone https://github.com/marcebusi/qa-api-testing-cryptogamer.git api
          git clone https://github.com/marcebusi/qa-performance-cryptogamer.git perf
          git clone https://github.com/marcebusi/qa-data-quality-cryptogamer.git dq

      - name: Install yamllint
        run: pip install yamllint

      - name: Validar YAMLs de GitHub Actions
        run: |
          echo "Validando workflows de cada proyecto..."
          for dir in e2e api perf dq; do
            if [ -d "$dir/.github/workflows" ]; then
              echo "=== $dir ==="
              yamllint -d relaxed $dir/.github/workflows/*.yml && echo "✅ OK"
            fi
          done

      - name: Contar tests por proyecto
        run: |
          echo "## Inventario de tests" >> $GITHUB_STEP_SUMMARY
          echo "| Proyecto | Archivos de test |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          E2E=$(find e2e/tests -name "*.spec.ts" 2>/dev/null | wc -l)
          API=$(find api/api-tests -name "*.spec.ts" 2>/dev/null | wc -l)
          PERF=$(find perf/tests -name "*.js" 2>/dev/null | wc -l)
          DQ=$(find dq/tests -name "*.py" 2>/dev/null | wc -l)
          echo "| 🎭 E2E Playwright | $E2E specs |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔌 API Playwright | $API specs |" >> $GITHUB_STEP_SUMMARY
          echo "| ⚡ Performance k6 | $PERF scripts |" >> $GITHUB_STEP_SUMMARY
          echo "| 🗄️ Data Quality pytest | $DQ módulos |" >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────────────────────────
  # JOB 5: Summary final
  # ─────────────────────────────────────────────────────────────
  summary:
    name: 📊 Pipeline Summary
    runs-on: ubuntu-latest
    needs: [lint-e2e, lint-api, data-quality, validate-pipelines]
    if: always()

    steps:
      - name: Generar resumen
        run: |
          echo "## 🎮 QA Pipeline — cryptogamer-ecommerce" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Suite | Estado |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| 🎭 E2E Lint (Playwright) | ${{ needs.lint-e2e.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔌 API Lint (Playwright) | ${{ needs.lint-api.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🗄️ Data Quality (pytest) | ${{ needs.data-quality.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📋 Validación YAMLs CI   | ${{ needs.validate-pipelines.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
