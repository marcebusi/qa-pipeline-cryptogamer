name: QA Master Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Corre todos los días a las 6 AM UTC (3 AM Argentina)
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: 'Suite a correr'
        required: false
        default: 'all'
        type: choice
        options: [all, e2e, api, data-quality, performance]

# Cancela runs anteriores si se pushea de nuevo antes de que terminen
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 0: Setup — levanta el backend una sola vez y lo comparte
  # ─────────────────────────────────────────────────────────────
  setup-backend:
    name: 🔧 Setup Backend
    runs-on: ubuntu-latest
    outputs:
      db-path: ${{ steps.paths.outputs.db-path }}

    steps:
      - name: Checkout pipeline repo
        uses: actions/checkout@v4

      - name: Clone cryptogamer-ecommerce
        run: |
          git clone https://github.com/marcebusi/cryptogamer-ecommerce.git app
          cd app/backend
          npm ci
          echo 'DATABASE_URL="file:./prisma/dev.db"' > .env
          echo 'JWT_SECRET="ci-test-secret"' >> .env
          echo 'PORT=3001' >> .env
          npx prisma migrate deploy --schema=./prisma/schema.prisma
          npx prisma db seed || true
          ls -la prisma/
        env:
          NODE_ENV: test
          DATABASE_URL: "file:./prisma/dev.db"

      - name: Set output paths
        id: paths
        run: echo "db-path=${{ github.workspace }}/app/backend/prisma/dev.db" >> $GITHUB_OUTPUT

      - name: Upload DB como artifact compartido
        uses: actions/upload-artifact@v4
        with:
          name: test-database
          path: app/backend/prisma/dev.db
          retention-days: 1

  # ─────────────────────────────────────────────────────────────
  # JOB 1: E2E Tests (Playwright)
  # ─────────────────────────────────────────────────────────────
  e2e-tests:
    name: 🎭 E2E Tests — Playwright
    runs-on: ubuntu-latest
    needs: setup-backend
    if: ${{ github.event.inputs.suite == 'all' || github.event.inputs.suite == 'e2e' || github.event.inputs.suite == '' || github.event_name != 'workflow_dispatch' }}

    steps:
      - name: Clone E2E repo
        uses: actions/checkout@v4
        with:
          repository: marcebusi/qa-playwright-cryptogamer
          path: e2e

      - name: Clone backend
        run: |
          git clone https://github.com/marcebusi/cryptogamer-ecommerce.git app
          cd app/backend && npm ci
          echo 'DATABASE_URL="file:./prisma/dev.db"' > .env
          echo 'JWT_SECRET="ci-test-secret"' >> .env
          echo 'PORT=3001' >> .env
          npx prisma migrate deploy --schema=./prisma/schema.prisma
          npx prisma db seed || true
          npm start &
          sleep 5
          cd ../..
          cd app && npm ci && npm run build
          npx serve -s dist -l 5173 &
          sleep 3
        env:
          DATABASE_URL: "file:./prisma/dev.db"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run E2E smoke tests
        working-directory: e2e
        run: npx playwright test --grep @smoke --reporter=html
        env:
          BASE_URL: http://localhost:5173
          API_URL: http://localhost:3001

      - name: Upload E2E report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: e2e/playwright-report/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # JOB 2: API Tests (Playwright API)
  # ─────────────────────────────────────────────────────────────
  api-tests:
    name: 🔌 API Tests — Playwright
    runs-on: ubuntu-latest
    needs: setup-backend
    if: ${{ github.event.inputs.suite == 'all' || github.event.inputs.suite == 'api' || github.event.inputs.suite == '' || github.event_name != 'workflow_dispatch' }}

    steps:
      - name: Clone API repo
        uses: actions/checkout@v4
        with:
          repository: marcebusi/qa-api-testing-cryptogamer
          path: api

      - name: Clone y levantar backend
        run: |
          git clone https://github.com/marcebusi/cryptogamer-ecommerce.git app
          cd app/backend && npm ci
          echo 'DATABASE_URL="file:./prisma/dev.db"' > .env
          echo 'JWT_SECRET="ci-test-secret"' >> .env
          echo 'PORT=3001' >> .env
          npx prisma migrate deploy --schema=./prisma/schema.prisma
          npx prisma db seed || true
          npm start &
          sleep 5
        env:
          DATABASE_URL: "file:./prisma/dev.db"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install y correr API tests
        working-directory: api
        run: |
          npm ci
          npx playwright test --reporter=html
        env:
          BASE_URL: http://localhost:3001

      - name: Upload API report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-report
          path: api/playwright-report/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # JOB 3: Data Quality Tests (pytest)
  # ─────────────────────────────────────────────────────────────
  data-quality-tests:
    name: 🗄️ Data Quality — pytest
    runs-on: ubuntu-latest
    needs: setup-backend
    if: ${{ github.event.inputs.suite == 'all' || github.event.inputs.suite == 'data-quality' || github.event.inputs.suite == '' || github.event_name != 'workflow_dispatch' }}

    steps:
      - name: Clone Data Quality repo
        uses: actions/checkout@v4
        with:
          repository: marcebusi/qa-data-quality-cryptogamer
          path: dq

      - name: Download DB artifact
        uses: actions/download-artifact@v4
        with:
          name: test-database
          path: db

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install y correr Data Quality tests
        working-directory: dq
        run: |
          pip install -r requirements.txt
          pytest tests/ -v --tb=short
        env:
          DB_PATH: ${{ github.workspace }}/db/dev.db

      - name: Upload DQ report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dq-report
          path: dq/reports/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # JOB 4: Performance Smoke (k6) — solo en push a main
  # ─────────────────────────────────────────────────────────────
  performance-smoke:
    name: ⚡ Performance Smoke — k6
    runs-on: ubuntu-latest
    needs: setup-backend
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event.inputs.suite == 'performance' }}

    steps:
      - name: Clone Performance repo
        uses: actions/checkout@v4
        with:
          repository: marcebusi/qa-performance-cryptogamer
          path: perf

      - name: Clone y levantar backend
        run: |
          git clone https://github.com/marcebusi/cryptogamer-ecommerce.git app
          cd app/backend && npm ci
          echo 'DATABASE_URL="file:./prisma/dev.db"' > .env
          echo 'JWT_SECRET="ci-test-secret"' >> .env
          echo 'PORT=3001' >> .env
          npx prisma migrate deploy --schema=./prisma/schema.prisma
          npx prisma db seed || true
          npm start &
        env:
          DATABASE_URL: "file:./prisma/dev.db"
          sleep 5

      - name: Install k6
        run: |
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install k6

      - name: Correr smoke test
        working-directory: perf
        run: k6 run --out json=results/smoke.json tests/01_smoke.js
        env:
          BASE_URL: http://localhost:3001

      - name: Upload k6 results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-report
          path: perf/results/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # JOB 5: Reporte final — se corre cuando todos terminan
  # ─────────────────────────────────────────────────────────────
  summary:
    name: 📊 Pipeline Summary
    runs-on: ubuntu-latest
    needs: [e2e-tests, api-tests, data-quality-tests]
    if: always()

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          path: all-reports

      - name: Generate summary
        run: |
          echo "## 🎮 QA Pipeline — cryptogamer-ecommerce" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Suite | Estado |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| 🎭 E2E (Playwright) | ${{ needs.e2e-tests.result == 'success' && '✅ Passed' || needs.e2e-tests.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔌 API (Playwright) | ${{ needs.api-tests.result == 'success' && '✅ Passed' || needs.api-tests.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🗄️ Data Quality (pytest) | ${{ needs.data-quality-tests.result == 'success' && '✅ Passed' || needs.data-quality-tests.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY

      - name: Upload combined reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all-reports
          path: all-reports/
          retention-days: 14
